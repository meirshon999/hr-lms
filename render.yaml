# Стенд: рабочая система, а не витрина. Демо-инструментов здесь нет —
# ни списка паролей на экране входа, ни сброса базы, ни выдуманных сотрудников.
#
# Чего этот стенд не умеет и уметь не может: бесплатный тариф Render не даёт
# постоянного диска, поэтому база и загруженные файлы стираются при каждом
# перезапуске. Для настоящей работы нужен свой сервер — см. README.
services:
  - type: web
    name: peg-hr-lms
    runtime: node
    plan: free
    rootDir: app
    # --include=dev обязателен: NODE_ENV=production заставляет npm пропускать
    # devDependencies, а tsc и vite лежат именно там — без них сборки нет.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Без этого сервер поднимется в режиме разработки: открытый CORS,
      # доступное дерево API и необязательный секрет токенов.
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.20.0
      - key: TZ_LMS
        value: Asia/Almaty
      # Генерируется Render, в репозиторий не попадает.
      - key: TOKEN_SECRET
        generateValue: true
      # Пароли администратора и кадровика. Задаются в панели, в репозиторий
      # не идут. Без них база при каждом перезапуске поднимается со случайными
      # паролями, и войти можно только подсмотрев их в журнале.
      - key: LMS_ADMIN_PASSWORD
        sync: false
      - key: LMS_HR_PASSWORD
        sync: false
      # Ключ ИИ задаётся руками в настройках сервиса — в репозиторий он не идёт.
      # Провайдер выводится из ключа сам, называть его отдельно не нужно.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
