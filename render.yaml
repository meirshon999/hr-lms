# Стенд для оценки: посмотреть, покликать, показать.
# Боевой сервер поднимается ИНАЧЕ — см. README.md, раздел «Что нужно задать
# на боевом сервере». Главное отличие: там НЕ должно быть LMS_DEV_TOOLS.
services:
  - type: web
    name: peg-hr-lms
    runtime: node
    plan: free
    rootDir: app
    # --include=dev обязателен: NODE_ENV=production заставляет npm пропускать
    # devDependencies, а tsc и vite лежат именно там — без них сборки нет.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Без этого сервер поднимется в режиме разработки: открытый CORS,
      # доступное дерево API и необязательный секрет токенов.
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.20.0
      - key: TZ_LMS
        value: Asia/Almaty
      # Генерируется Render, в репозиторий не попадает.
      - key: TOKEN_SECRET
        generateValue: true
      # ТОЛЬКО для стенда оценки: демо-сотрудники, подмена даты, сброс базы и
      # список аккаунтов с паролями на экране входа. На боевом сервере эту
      # переменную не задавать — тогда этих возможностей не существует вовсе.
      - key: LMS_DEV_TOOLS
        value: "1"
      # Ключ ИИ задаётся руками в настройках сервиса — в репозиторий он не идёт.
      # Провайдер выводится из ключа сам, называть его отдельно не нужно.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
