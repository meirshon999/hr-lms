openapi: 3.1.0
info:
  title: PEG HR LMS v1 API
  version: "1.0.0"
  description: >
    HTTP-контракт системы онбординга новых сотрудников (см. SPEC.md).
    Один сервис. Все пути под /api/v1. Реализовано в app/.
    Ошибка любого запроса: { error: { code, message, details? }, request_id }.
servers:
  - url: /api/v1

tags:
  - name: auth
  - name: me
    description: экраны сотрудника (роль employee)
  - name: employees
    description: работа HR с сотрудниками (роли hr, admin)
  - name: catalog
    description: конструктор контента (роли hr, admin)
  - name: analytics
    description: сводка для HR
  - name: ai
    description: конструктор на ИИ — черновики и планы, каталог меняет только человек
  - name: admin
    description: аккаунты, состав сети и журнал (только роль admin)
  - name: dev
    description: ТОЛЬКО прототип — демо-часы и сброс; в проде модуля нет

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  responses:
    Err:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error, request_id]
      properties:
        request_id: { type: string }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "snake_case машинный код" }
            message: { type: string }
            details: {}
    Stage:
      type: string
      enum: [intern, onboarding, completed, archived]
    ContentType:
      type: string
      enum: [video, pdf, text]
    LessonStatus:
      type: string
      enum: [locked, available, passed]
    Answer:
      type: object
      required: [question_id, option_index]
      properties:
        question_id: { type: string, format: uuid }
        option_index: { type: integer }
    TestResult:
      type: object
      properties:
        score_pct: { type: integer }
        passed: { type: boolean }
        pass_mark_pct: { type: integer }
        total: { type: integer }
        correct: { type: integer }
        attempt_no: { type: integer }
    EmployeeRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        iin: { type: string, description: ключ человека по всей сети }
        full_name: { type: string }
        position: { type: string }
        position_id: { type: string, format: uuid }
        location: { type: string }
        location_id: { type: string, format: uuid }
        phone: { type: string }
        start_date: { type: string, format: date }
        stage: { $ref: '#/components/schemas/Stage' }
        onboarding_due_date: { type: [string, "null"], format: date }
        overdue: { type: boolean }
        progress:
          type: object
          properties:
            passed: { type: integer }
            total: { type: integer }
    QuestionEmployee:
      description: вопрос без верного ответа (для сотрудника)
      type: object
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        options: { type: array, items: { type: string } }
    QuestionAuthor:
      allOf:
        - $ref: '#/components/schemas/QuestionEmployee'
        - type: object
          properties:
            correct_index: { type: integer }

security:
  - bearer: []

paths:
  # ---------------- auth ----------------
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Вход по логину и паролю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, enum: [employee, hr, admin] }
                  must_change_password:
                    type: boolean
                    description: выдан временный пароль — до смены доступен только экран смены
        "401": { $ref: '#/components/responses/Err' }
        "429": { $ref: '#/components/responses/Err', description: "too_many_attempts — 10 неудач с адреса за 15 минут" }
  /auth/change-password:
    post:
      tags: [auth]
      summary: Сменить пароль (обязательно после выдачи временного)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 6, maxLength: 72 }
      responses:
        "200": { description: ok }
        "401": { $ref: '#/components/responses/Err', description: "bad_credentials — текущий пароль неверен" }
        "422": { $ref: '#/components/responses/Err', description: "same_password" }
  /auth/logout:
    post: { tags: [auth], summary: Выход, responses: { "200": { description: ok } } }
  /me:
    get:
      tags: [auth]
      summary: Текущий пользователь и связанный сотрудник
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      login: { type: string }
                      role: { type: string }
                  employee:
                    type: [object, "null"]
                    properties:
                      id: { type: string }
                      full_name: { type: string }
                      stage: { $ref: '#/components/schemas/Stage' }
                      position_id: { type: string }
  /demo/accounts:
    get:
      tags: [auth]
      security: []
      summary: "Список демо-аккаунтов (ТОЛЬКО прототип)"
      responses:
        "200": { description: "массив объектов login/password/role/name/stage" }

  # ---------------- me (employee) ----------------
  /me/pre-onboarding:
    get:
      tags: [me]
      summary: Материалы пре-онбординга и отметки просмотра
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  done: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        content_type: { $ref: '#/components/schemas/ContentType' }
                        file_url: { type: [string, "null"] }
                        text_body: { type: [string, "null"] }
                        viewed: { type: boolean }
  /me/pre-onboarding/{itemId}/view:
    post:
      tags: [me]
      summary: Отметить материал просмотренным
      parameters: [{ name: itemId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  onboarding_opened: { type: boolean }
  /me/trajectory:
    get:
      tags: [me]
      summary: Траектория сотрудника с прогрессом
      description: 409, если stage = intern (онбординг не открыт).
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  stage: { $ref: '#/components/schemas/Stage' }
                  onboarding_due_date: { type: [string, "null"] }
                  overdue: { type: boolean }
                  progress: { type: object, properties: { passed: { type: integer }, total: { type: integer } } }
                  trajectory:
                    type: [object, "null"]
                    properties:
                      blocks:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            title: { type: string }
                            lessons:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: string }
                                  title: { type: string }
                                  status: { $ref: '#/components/schemas/LessonStatus' }
                                  material_done: { type: boolean }
                                  material_type: { type: [string, "null"] }
                      attestation:
                        type: object
                        properties:
                          available: { type: boolean }
                          passed: { type: boolean }
                          question_count: { type: integer }
                          pass_mark_pct: { type: integer }
        "409": { $ref: '#/components/responses/Err' }
  /me/lessons/{lessonId}:
    get:
      tags: [me]
      summary: Детали урока (материал + тест без верных ответов)
      description: 403, если урок locked.
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string }
                  status: { $ref: '#/components/schemas/LessonStatus' }
                  material_done: { type: boolean }
                  material:
                    type: [object, "null"]
                    properties:
                      content_type: { $ref: '#/components/schemas/ContentType' }
                      file_url: { type: [string, "null"] }
                      text_body: { type: [string, "null"] }
                      min_watch_pct: { type: [integer, "null"] }
                  test:
                    type: [object, "null"]
                    properties:
                      id: { type: string }
                      pass_mark_pct: { type: integer }
                      questions: { type: array, items: { $ref: '#/components/schemas/QuestionEmployee' } }
                      last_attempt:
                        type: [object, "null"]
                        properties:
                          attempt_no: { type: integer }
                          score_pct: { type: integer }
                          passed: { type: boolean }
        "403": { $ref: '#/components/responses/Err' }
  /me/lessons/{lessonId}/video-progress:
    post:
      tags: [me]
      summary: Отчёт о просмотре видео (прогресс копится на сервере)
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [pct], properties: { pct: { type: integer, minimum: 0, maximum: 100 } } } } } }
      responses:
        "200": { description: "{ video_pct }" }
        "403": { $ref: '#/components/responses/Err' }
  /me/lessons/{lessonId}/material-done:
    post:
      tags: [me]
      summary: Отметить материал урока пройденным (идемпотентно)
      description: >
        Для видео сервер проверяет накопленный video_pct >= min_watch_pct,
        иначе 422 video_not_watched.
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ ok: true }" }
        "403": { $ref: '#/components/responses/Err' }
        "422": { $ref: '#/components/responses/Err', description: video_not_watched }
  /me/lessons/{lessonId}/test:
    post:
      tags: [me]
      summary: Сдать тест урока
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers: { type: array, items: { $ref: '#/components/schemas/Answer' } }
      responses:
        "200":
          content: { application/json: { schema: { $ref: '#/components/schemas/TestResult' } } }
  /me/attestation:
    get:
      tags: [me]
      summary: Финальный тест аттестации
      description: 403, если не все уроки пройдены.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  test_id: { type: string }
                  pass_mark_pct: { type: integer }
                  questions: { type: array, items: { $ref: '#/components/schemas/QuestionEmployee' } }
                  last_attempt: { type: [object, "null"] }
                  completed: { type: boolean }
        "403": { $ref: '#/components/responses/Err' }
    post:
      tags: [me]
      summary: Сдать аттестацию (при passed → stage = completed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers: { type: array, items: { $ref: '#/components/schemas/Answer' } }
      responses:
        "200": { content: { application/json: { schema: { $ref: '#/components/schemas/TestResult' } } } }
        "422": { $ref: '#/components/responses/Err' }

  # ---------------- employees (HR) ----------------
  /employees:
    get:
      tags: [employees]
      summary: Список сотрудников
      parameters:
        - { name: stage, in: query, schema: { $ref: '#/components/schemas/Stage' } }
        - { name: position_id, in: query, schema: { type: string } }
        - { name: location_id, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string }, description: ФИО, телефон или ИИН }
        - { name: include_archived, in: query, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/EmployeeRow' } }
    post:
      tags: [employees]
      summary: Завести сотрудника (создаёт User + Employee, stage = intern)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [iin, full_name, position_id, location_id, phone, start_date, login, password]
              properties:
                iin:
                  type: string
                  description: 12 цифр, проверяется контрольная сумма. Ключ человека по всей сети
                full_name: { type: string, maxLength: 160 }
                position_id: { type: string }
                location_id: { type: string }
                phone: { type: string, description: не уникален — телефон меняется }
                start_date: { type: string, format: date }
                login: { type: string }
                password: { type: string, minLength: 6, description: временный, сотрудник сменит при первом входе }
      responses:
        "201":
          description: "{ employee, warnings: string[] } — warnings может содержать no_active_trajectory"
        "422": { $ref: '#/components/responses/Err', description: "bad_iin / iin_exists / login_exists / start_date_too_old" }
  /employees/{id}:
    get:
      tags: [employees]
      summary: Карточка сотрудника (этап, прогресс по блокам/урокам, логин)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: подробная карточка }
        "404": { $ref: '#/components/responses/Err' }
    patch:
      tags: [employees]
      summary: Изменить ФИО / телефон
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                phone: { type: string }
      responses:
        "200": { description: "{ ok: true }" }
        "422": { $ref: '#/components/responses/Err' }
  /employees/{id}/internship-passed:
    post:
      tags: [employees]
      summary: Отметить стажировку пройденной (пробует открыть онбординг)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ ok, onboarding_opened, reason }" }
        "409": { $ref: '#/components/responses/Err', description: "не intern" }
  /employees/{id}/internship-failed:
    post:
      tags: [employees]
      summary: Стажировку не прошёл — удаляет сотрудника и весь прогресс
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ ok, deleted: true }" }
        "409": { $ref: '#/components/responses/Err' }
  /employees/{id}/transfer:
    post:
      tags: [employees]
      summary: Перевести на другую точку (R-13)
      description: >
        Снимок пересобирается под новую точку. Сданные общие уроки остаются сданными,
        уроки со своим содержимым на каждой точке открываются заново, отсутствующие
        на новой точке исчезают. Дедлайн не сдвигается.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location_id]
              properties:
                location_id: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  kept: { type: integer, description: зачтено сданных уроков }
                  redo: { type: integer, description: открыто заново — на новой точке они другие }
                  added: { type: integer, description: добавлено уроков, которых не было }
        "409": { $ref: '#/components/responses/Err', description: "same_location / no_location / archived" }
  /employees/{id}/archive:
    post:
      tags: [employees]
      summary: В архив (user.is_active = false, данные сохраняются)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{ ok: true }" } }
  /files:
    post:
      tags: [files]
      summary: Загрузить файл (видео, PDF, картинка) — только hr/admin
      description: >
        multipart/form-data с полем file. Ограничения: mp4, webm, mov, pdf, png, jpg;
        размер задаётся переменной MAX_UPLOAD_MB (по умолчанию 60).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: "{ id, url, kind, orig_name, mime, size_bytes }" }
        "413": { $ref: '#/components/responses/Err' }
        "415": { $ref: '#/components/responses/Err' }
    get:
      tags: [files]
      summary: Список загруженных файлов (hr/admin)
      responses:
        "200": { description: "{ items: [...] }" }
  /files/{id}:
    get:
      tags: [files]
      summary: Отдать файл
      description: >
        Без заголовка авторизации: video и object его не отправляют. Защита —
        неугадываемый uuid. Поддерживается Range для перемотки видео.
        В проде заменить на подписанные ссылки или отдачу из хранилища платформы.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: содержимое файла }
        "206": { description: часть файла (Range) }
        "404": { $ref: '#/components/responses/Err' }
    delete:
      tags: [files]
      summary: Удалить файл (hr/admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ ok: true }" }
  /employees/{id}/unarchive:
    post:
      tags: [employees]
      summary: Вернуть из архива (этап восстанавливается по данным, прогресс сохранён)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ ok: true, stage }" }
        "409": { $ref: '#/components/responses/Err' }
  /employees/{id}/extend-deadline:
    post:
      tags: [employees]
      summary: Продлить срок онбординга
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: { type: integer, minimum: 1, maximum: 90 }
      responses:
        "200": { description: "{ ok: true, onboarding_due_date }" }
        "409": { $ref: '#/components/responses/Err' }
  /employees/{id}/pause:
    post:
      tags: [employees]
      summary: Поставить онбординг на паузу (болезнь, отпуск) — срок замораживается
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ ok: true }" }
        "409": { $ref: '#/components/responses/Err' }
  /employees/{id}/resume:
    post:
      tags: [employees]
      summary: Снять с паузы — дедлайн сдвигается на длительность простоя
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ ok: true, paused_days, onboarding_due_date }" }
        "409": { $ref: '#/components/responses/Err' }
  /employees/{id}/reset-password:
    post:
      tags: [employees]
      summary: Сбросить пароль — возвращает новый
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{ password: string }" } }
  /employees/{id}/audit:
    get:
      tags: [employees]
      summary: Журнал действий по сотруднику
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{ items: [{ ts, actor_login, action, detail }] }" } }
  /employees/{id}/invite:
    post:
      tags: [employees]
      summary: Ссылка-приглашение
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{ invite_url, login }" } }

  # ---------------- catalog / конструктор (HR) ----------------
  /locations:
    get:
      tags: [catalog]
      summary: Точки сети
      parameters:
        - { name: include_inactive, in: query, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        city: { type: string, nullable: true }
                        is_active: { type: boolean }
                        employees: { type: integer, description: действующих сотрудников на точке }
    post:
      tags: [catalog]
      summary: Добавить точку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                city: { type: string, nullable: true }
      responses:
        "201": { description: "{ id }" }
        "422": { $ref: '#/components/responses/Err', description: name_exists }
  /locations/{id}:
    patch:
      tags: [catalog]
      summary: Изменить или закрыть точку
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                city: { type: string, nullable: true }
                is_active: { type: boolean }
      responses:
        "200": { description: ok }
        "409": { $ref: '#/components/responses/Err', description: "has_employees — сначала переведите людей (C-12)" }
  /positions:
    get: { tags: [catalog], summary: Список должностей, responses: { "200": { description: "{ items: [{id,name,trajectory_status,trajectory_id}] }" } } }
    post:
      tags: [catalog]
      summary: Создать должность (+ пустая траектория draft + блок аттестации)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }
      responses: { "201": { description: position }}
  /positions/{id}:
    patch:
      tags: [catalog]
      summary: Переименовать должность
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } } }
      responses: { "200": { description: ok } }
    delete:
      tags: [catalog]
      summary: Удалить должность (только если нет сотрудников)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: ok }
        "409": { $ref: '#/components/responses/Err', description: has_employees }
  /trajectories/{positionId}:
    get:
      tags: [catalog]
      summary: Полное дерево траектории (с верными ответами) + problems[]
      parameters: [{ name: positionId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: >
            { id, status, pre_onboarding[], blocks[] (regular: lessons[] с material и test;
            attestation: test), problems: string[] }
  /trajectories/{positionId}/publish:
    post:
      tags: [catalog]
      summary: draft → active (проверка полноты C-2)
      parameters: [{ name: positionId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ ok, status: active }" }
        "422": { $ref: '#/components/responses/Err', description: "trajectory_incomplete, details = список проблем" }
  /trajectories/{positionId}/unpublish:
    post:
      tags: [catalog]
      summary: active → draft
      parameters: [{ name: positionId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /trajectories/{positionId}/pre-onboarding:
    post:
      tags: [catalog]
      summary: Добавить материал пре-онбординга
      parameters: [{ name: positionId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content_type]
              properties:
                title: { type: string }
                content_type: { $ref: '#/components/schemas/ContentType' }
                file_url: { type: [string, "null"] }
                text_body: { type: [string, "null"] }
      responses: { "201": { description: "{ id }" } }
  /trajectories/{positionId}/pre-onboarding/order:
    put:
      tags: [catalog]
      summary: Переупорядочить материалы пре-онбординга
      parameters: [{ name: positionId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string } } } } } } }
      responses: { "200": { description: ok } }
  /pre-onboarding/{id}:
    patch:
      tags: [catalog]
      summary: Изменить материал пре-онбординга
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { title: { type: string }, content_type: { $ref: '#/components/schemas/ContentType' }, file_url: { type: string }, text_body: { type: string } } } } } }
      responses: { "200": { description: ok } }
    delete:
      tags: [catalog]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /trajectories/{positionId}/blocks:
    post:
      tags: [catalog]
      summary: Добавить блок (regular, встаёт перед аттестацией)
      parameters: [{ name: positionId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title], properties: { title: { type: string } } } } } }
      responses: { "201": { description: "{ id }" } }
  /trajectories/{positionId}/blocks/order:
    put:
      tags: [catalog]
      summary: Переупорядочить regular-блоки (аттестация всегда последняя)
      parameters: [{ name: positionId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string } } } } } } }
      responses: { "200": { description: ok } }
  /blocks/{id}:
    patch:
      tags: [catalog]
      summary: Переименовать блок (только regular)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { title: { type: string } } } } } }
      responses: { "200": { description: ok } }
    delete:
      tags: [catalog]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: ok }
        "409": { $ref: '#/components/responses/Err', description: "блок аттестации удалить нельзя" }
  /blocks/{id}/lessons:
    post:
      tags: [catalog]
      summary: Добавить урок в блок
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title], properties: { title: { type: string } } } } } }
      responses:
        "201": { description: "{ id }" }
        "409": { $ref: '#/components/responses/Err', description: "в блок аттестации уроки не добавляются" }
  /blocks/{id}/lessons/order:
    put:
      tags: [catalog]
      summary: Переупорядочить уроки блока
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string } } } } } } }
      responses: { "200": { description: ok } }
  /blocks/{id}/test:
    put:
      tags: [catalog]
      summary: Создать/обновить тест блока аттестации
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [pass_mark_pct], properties: { pass_mark_pct: { type: integer, minimum: 1, maximum: 100 } } } } } }
      responses: { "200": { description: "{ test_id }" } }
  /lessons/{id}:
    patch:
      tags: [catalog]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { title: { type: string } } } } } }
      responses: { "200": { description: ok } }
    delete:
      tags: [catalog]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /lessons/{id}/material:
    put:
      tags: [catalog]
      summary: Создать/обновить материал урока
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type]
              properties:
                content_type: { $ref: '#/components/schemas/ContentType' }
                file_url: { type: [string, "null"] }
                text_body: { type: [string, "null"] }
                min_watch_pct: { type: [integer, "null"], minimum: 0, maximum: 100 }
      responses: { "200": { description: ok } }
  /lessons/{id}/test:
    put:
      tags: [catalog]
      summary: Создать/обновить тест урока
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [pass_mark_pct], properties: { pass_mark_pct: { type: integer } } } } } }
      responses: { "200": { description: "{ test_id }" } }
  /tests/{id}/questions:
    post:
      tags: [catalog]
      summary: Добавить вопрос
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, options, correct_index]
              properties:
                text: { type: string }
                options: { type: array, minItems: 2, maxItems: 6, items: { type: string } }
                correct_index: { type: integer }
      responses: { "201": { description: "{ id }" } }
  /questions/{id}:
    patch:
      tags: [catalog]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                options: { type: array, items: { type: string } }
                correct_index: { type: integer }
      responses: { "200": { description: ok } }
    delete:
      tags: [catalog]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }

  # ---------------- ai ----------------
  # Между моделью и каталогом всегда стоит человек: ни один адрес ниже
  # не меняет каталог сам, кроме apply — а его нажимает кадровик (правило C-13).
  /ai/status:
    get:
      tags: [ai]
      summary: Включён ли ИИ, какой провайдер и модель
      responses: { "200": { description: "{ enabled, provider, model, reason, stt }" } }
  /ai/extract:
    post:
      tags: [ai]
      summary: Документ → текст (.docx, .txt, .md)
      description: >
        Файл не сохраняется. Заголовки Word размечаются решётками и отдаются
        отдельным списком — это готовое оглавление для плана траектории.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
      responses:
        "200": { description: "{ text, headings, kind, chars }" }
        "422": { description: "doc_old_format | doc_pdf | doc_broken | doc_unsupported" }
  /ai/transcribe:
    post:
      tags: [ai]
      summary: Надиктованное → текст
      description: Запись нигде не сохраняется — живёт столько, сколько идёт расшифровка.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
      responses: { "200": { description: "{ text }" }, "503": { description: ключ не задан } }
  /ai/lessons/{id}/draft:
    post:
      tags: [ai]
      summary: Собрать черновик урока из регламента
      description: В каталог не пишет. Черновик ждёт подтверждения человека.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_text]
              properties:
                source_text: { type: string }
                location_id: { type: string }
      responses:
        "200": { description: "{ draft, provider, model, applied: false }" }
        "422": { description: "source_too_short | source_not_meaningful | source_too_long" }
        "429": { description: бесплатный лимит исчерпан }
        "503": { description: провайдер не задан }
    get:
      tags: [ai]
      summary: Последний черновик урока
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
      responses: { "200": { description: ok }, "404": { description: черновика нет } }
    delete:
      tags: [ai]
      summary: Выбросить черновик
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /ai/lessons/{id}/apply:
    post:
      tags: [ai]
      summary: Черновик становится уроком
      description: >
        Единственное место, где собранное ИИ попадает в каталог (C-13).
        Материал и тест заменяются целиком: иначе к новым вопросам добавились бы прежние.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok }, "400": { description: черновик не той формы } }
  /ai/lessons/{id}/source:
    get:
      tags: [ai]
      summary: Кусок документа, из которого вырос урок
      description: Подставляется в поле сборки, чтобы не искать абзац в регламенте заново.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{ source_text }" }, "404": { description: урок заводили руками } }
  /ai/blocks/{id}/attestation:
    post:
      tags: [ai]
      summary: Собрать финальную аттестацию по материалам уроков
      description: >
        Вопросы СВОИ, а не переписанные из уроков: модели показывают уже заданные
        и просят спросить иначе — повтор проверял бы память на ответы, которые
        сотрудник видел час назад. В основу идут только общие уроки: аттестация
        одна на сеть, а содержимое точечного урока на каждой точке своё.
        Каталога не касается.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { count: { type: integer, minimum: 5, maximum: 20 } }
      responses:
        "200": { description: "{ draft, provider, model, based_on, empty, per_location, avoided }" }
        "404": { description: это не блок аттестации }
        "422": { description: "source_too_short — заполненных уроков меньше двух" }
    get:
      tags: [ai]
      summary: Сохранённый черновик аттестации
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok }, "404": { description: черновика нет } }
    delete:
      tags: [ai]
      summary: Выбросить черновик аттестации
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /ai/blocks/{id}/attestation/apply:
    post:
      tags: [ai]
      summary: Черновик становится аттестацией
      description: >
        Вопросы заменяются целиком — иначе при каждой пересборке тест удваивался бы.
        Принимается то, что прислал человек: он вправе выбросить лишние вопросы
        и оставить хоть три.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft]
              properties:
                draft: { type: object }
                pass_mark_pct: { type: integer, minimum: 1, maximum: 100 }
      responses: { "200": { description: "{ test_id, questions, pass_mark_pct }" } }
  /ai/drafts:
    get:
      tags: [ai]
      summary: Что ещё ждёт проверки человеком
      responses: { "200": { description: "{ items: [...] }" } }
  /ai/trajectories/{position_id}/plan:
    post:
      tags: [ai]
      summary: Документ целиком → предложенная структура траектории
      description: >
        Модели уходит ОГЛАВЛЕНИЕ, а не текст: этого хватает разложить темы,
        и запрос остаётся дешёвым на большом регламенте. Каталога не касается.
        Модель не пишет текст, а расставляет номера разделов по урокам —
        придумать несуществующий раздел она не может.
      parameters: [{ name: position_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_text]
              properties: { source_text: { type: string } }
      responses:
        "200":
          description: "{ plan: { blocks: [{ title, lessons: [{ title, sections }] }] }, sections, provider, model }"
        "422": { description: "source_too_short | source_too_long | source_flat" }
    get:
      tags: [ai]
      summary: Сохранённое предложение
      parameters: [{ name: position_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok }, "404": { description: плана нет } }
    delete:
      tags: [ai]
      summary: Выбросить предложение
      parameters: [{ name: position_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /ai/trajectories/{position_id}/plan/apply:
    post:
      tags: [ai]
      summary: План становится каркасом траектории
      description: >
        Присылается план, ПОПРАВЛЕННЫЙ человеком, а не тот, что предложила модель.
        Блоки и уроки создаются пустыми: материал и тест собираются потом, по одному.
        Аттестация остаётся последним блоком. Кусок документа сохраняется рядом
        с каждым уроком.
      parameters: [{ name: position_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties: { plan: { type: object } }
      responses:
        "200": { description: "{ blocks, lessons }" }
        "404": { description: сначала соберите план }

  # ---------------- admin ----------------
  # Кадровику все адреса ниже отвечают 403: он ведёт людей и содержание,
  # доступы и устройство сети — дело администратора.
  /audit:
    get:
      tags: [admin]
      summary: Общий журнал действий (только admin)
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }]
      responses: { "200": { description: "{ items: [{ ts, actor_login, action, employee_id, detail }] }" } }
  /users:
    get:
      tags: [admin]
      summary: Аккаунты кадровиков и администраторов
      description: Учётки сотрудников сюда не попадают — они заводятся вместе с человеком.
      responses: { "200": { description: "{ items: [{ id, login, role, is_active, must_change_password }] }" } }
    post:
      tags: [admin]
      summary: Завести служебный аккаунт
      description: >
        Пароль возвращается ОДИН раз — в базе лежит только свёртка. Не задан —
        придумывается системой. Аккаунт всегда создаётся с временным паролем.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, role]
              properties:
                login: { type: string, minLength: 2, maxLength: 40, pattern: "^[a-zA-Z0-9._-]+$" }
                role: { type: string, enum: [hr, admin] }
                password: { type: string, minLength: 6, maxLength: 72 }
      responses:
        "201": { description: "{ id, login, role, password }" }
        "422": { description: login_exists }
  /users/{id}:
    patch:
      tags: [admin]
      summary: Включить или отключить аккаунт
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties: { is_active: { type: boolean } }
      responses:
        "200": { description: "{ id, is_active }" }
        "422": { description: "self_disable — собственный аккаунт отключить нельзя" }
  /users/{id}/reset-password:
    post:
      tags: [admin]
      summary: Выдать новый временный пароль
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{ login, password }" } }

  # ---------------- analytics ----------------
  /analytics:
    get:
      tags: [analytics]
      summary: Сводка по онбордингу
      parameters:
        - name: location
          in: query
          description: Разрез воронки по одной точке. Остальные цифры — по всей сети.
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  by_stage: { type: object, additionalProperties: { type: integer } }
                  total: { type: integer }
                  overdue: { type: integer }
                  avg_onboarding_days: { type: [number, "null"] }
                  funnel:
                    type: array
                    description: >
                      Ступени: принят → начал обучение → блоки по порядку → аттестация.
                      На каждой три числа: дошли за всё время, стоят сейчас, ушли (архив).
                      applicable — скольких людей ступень вообще касается: блок, которого
                      нет у точки, считается только по тем, у кого он есть в снимке.
                    items:
                      type: object
                      properties:
                        position_id: { type: string }
                        position: { type: string }
                        cohort: { type: integer, description: все заведённые на должность, включая архив }
                        steps:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string, description: "hired | started | block:<id> | attested" }
                              title: { type: string }
                              applicable: { type: integer }
                              reached: { type: integer }
                              now: { type: integer }
                              lost: { type: integer }
                              avg_days: { type: [number, "null"] }

  # ---------------- dev (только прототип) ----------------
  /dev/clock:
    get:
      tags: [dev]
      security: []
      summary: "Демо-дата"
      responses: { "200": { description: "{ today, overridden }" } }
    post:
      tags: [dev]
      summary: Установить демо-дату
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [date], properties: { date: { type: string, format: date } } } } } }
      responses: { "200": { description: "{ today, overridden }" } }
  /dev/clock/advance:
    post:
      tags: [dev]
      summary: Сдвинуть демо-дату на N дней
